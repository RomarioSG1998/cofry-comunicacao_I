<main class="max-w-7xl mx-auto px-6 pt-8 space-y-8 animate-fade-in-up pb-20 relative z-10">
    
    <!-- Header Section -->
    <div class="bg-white rounded-[2rem] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-50 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
      <div>
        <h2 class="text-3xl font-extrabold text-slate-900">Boletos DDA</h2>
        <p class="text-sm text-slate-500 mt-1">Monitore e pague boletos emitidos em seu CPF de forma integrada</p>
      </div>
      <button (click)="openAddForm()" class="px-5 py-3 bg-[#00A868] hover:bg-[#008f58] text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-250 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Cadastrar Boleto
      </button>
    </div>

    <!-- Boletos List -->
    <section class="bg-white rounded-3xl border border-slate-100 shadow-sm overflow-hidden">
      <div class="p-6 border-b border-slate-50">
        <h3 class="font-bold text-slate-800 text-lg">Boletos Emitidos</h3>
      </div>

      <div *ngIf="boletos.length === 0" class="p-12 text-center text-slate-400">
        Nenhum boleto DDA cadastrado no momento.
      </div>

      <div *ngIf="boletos.length > 0" class="divide-y divide-slate-50">
        <div *ngFor="let boleto of boletos" class="p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:bg-slate-50/50 transition-colors">
          <div class="flex items-start gap-4">
            <div class="p-3 rounded-2xl" [ngClass]="{'bg-amber-50 text-amber-600': boleto.status === 'pendente', 'bg-emerald-50 text-emerald-600': boleto.status === 'pago'}">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><line x1="12" y1="4" x2="12" y2="20"></line></svg>
            </div>
            <div>
              <p class="font-mono text-sm text-slate-700 tracking-wide break-all">{{ boleto.codBarras }}</p>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-xs font-semibold text-slate-400">Vencimento: {{ boleto.vencimento | date:'dd/MM/yyyy' }}</span>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider" 
                      [ngClass]="{'bg-amber-100 text-amber-700': boleto.status === 'pendente', 'bg-emerald-100 text-emerald-700': boleto.status === 'pago'}">
                  {{ boleto.status }}
                </span>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 w-full md:w-auto justify-end">
            <button *ngIf="boleto.status === 'pendente'" (click)="payBoleto(boleto)" class="px-4 py-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 text-xs font-bold rounded-xl transition-all">
              Marcar como Pago
            </button>
            <button (click)="openEditForm(boleto)" class="p-2 bg-slate-50 hover:bg-slate-100 text-slate-500 rounded-xl transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
            </button>
            <button (click)="deleteBoleto(boleto.idBoleto!)" class="p-2 bg-red-50 hover:bg-red-100 text-red-500 rounded-xl transition-all">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Modal Form -->
    <div *ngIf="showForm" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
      <div class="bg-white rounded-3xl w-full max-w-md p-8 border border-slate-100 shadow-2xl relative animate-fade-in-up">
        
        <button (click)="closeForm()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>

        <h3 class="text-xl font-bold text-slate-900 mb-6">{{ isEdit ? 'Editar Boleto' : 'Novo Boleto DDA' }}</h3>

        <form (submit)="onSubmit($event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Código de Barras</label>
            <input 
              type="text"
              [value]="boletoForm.codBarras"
              (input)="formatBarcode($event)"
              placeholder="00000.00000 00000.000000..."
              required
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all outline-none font-mono"
            >
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Vencimento</label>
            <input 
              type="date"
              [(ngModel)]="boletoForm.vencimento"
              name="vencimento"
              required
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all outline-none"
            >
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Status</label>
            <select 
              [(ngModel)]="boletoForm.status"
              name="status"
              required
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all outline-none cursor-pointer"
            >
              <option value="pendente">Pendente</option>
              <option value="pago">Pago</option>
            </select>
          </div>

          <div class="flex gap-3 mt-6">
            <button type="button" (click)="closeForm()" class="flex-1 py-3 border border-slate-200 rounded-xl font-bold text-slate-500 hover:bg-slate-50 transition-all">
              Cancelar
            </button>
            <button type="submit" class="flex-1 py-3 bg-[#00A868] hover:bg-[#008f58] text-white font-bold rounded-xl transition-all shadow-lg shadow-emerald-250">
              Confirmar
            </button>
          </div>
        </form>

      </div>
    </div>
</main>
