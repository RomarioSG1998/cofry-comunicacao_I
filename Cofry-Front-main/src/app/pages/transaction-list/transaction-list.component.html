<section class="min-h-screen bg-gray-50 p-6">
  <!-- Título -->
  <header class="mb-6">
    <h1 class="text-2xl font-bold text-gray-800">
      Extrato
    </h1>
    <p class="text-sm text-gray-500">
      Histórico de movimentações
    </p>
  </header>

  <!-- Lista de Transações -->
  <div class="bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
    <div
      *ngFor="let transaction of transactions; let last = last"
      class="px-6"
    >
      <app-transaction-card
        [transaction]="transaction"
      >
        <!-- Botões de Ação -->
        <div class="flex gap-2 ml-2">
          <button
            (click)="openEditTransactionForm(transaction)"
            class="text-slate-400 hover:text-slate-600 transition-colors p-1"
            title="Editar"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
          </button>
          <button
            (click)="deleteTransaction(transaction)"
            class="text-slate-400 hover:text-red-600 transition-colors p-1"
            title="Excluir"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </app-transaction-card>
    </div>
  </div>

  <!-- Estado vazio -->
  <div
    *ngIf="transactions.length === 0"
    class="flex flex-col items-center justify-center mt-20 text-gray-400"
  >
    <i class="ri-inbox-line text-5xl mb-4"></i>
    <span>Nenhuma transação encontrada</span>
  </div>
</section>
