<div class="w-full max-w-md bg-white/60 backdrop-blur-xl border border-white/40 rounded-3xl shadow-[0_30px_60px_-12px_rgba(0,0,0,0.15)] p-8 md:p-10 animate-fade-in-up relative z-20">
    
    <!-- Logo no Card -->
    <div class="flex justify-center mb-6">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-gradient-to-tr from-emerald-500 to-emerald-700 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-500/30">
                <img src="tete.png" alt="Logo Cofry" class="w-5 h-5 object-contain drop-shadow-sm">
            </div>
            <span class="text-xl font-bold tracking-tight text-slate-800">Cofry</span>
        </div>
    </div>

    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-slate-800">Bem-vindo de volta</h2>
        <p class="text-slate-500 mt-2">Acesse sua conta para continuar</p>
    </div>

    <!-- Formulário -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5">
        
        <!-- Campo Email -->
        <div class="space-y-2">
            <label class="text-sm font-bold text-slate-700 ml-1">Email ou CPF</label>
            <div class="relative">
                <span class="absolute left-4 top-3.5 text-slate-400 transition-colors" [class.text-emerald-500]="isFieldValid('email')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </span>
                <input 
                    type="text" 
                    formControlName="email"
                    class="w-full pl-11 pr-4 py-3 bg-white/50 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-800 placeholder:text-slate-400"
                    [class.border-red-400]="isFieldInvalid('email')"
                    [class.border-slate-200]="!isFieldInvalid('email')"
                    placeholder="seu@email.com"
                >
            </div>
            <div *ngIf="isFieldInvalid('email')" class="text-red-500 text-xs ml-1 font-medium">Por favor, insira um email válido.</div>
        </div>
        
        <!-- Mensagem de Erro -->
        <div *ngIf="errorMessage" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-xl text-sm font-medium">
            {{ errorMessage }}
        </div>
        
        <!-- Campo Senha -->
        <div class="space-y-2">
            <div class="flex justify-between items-center ml-1">
                <label class="text-sm font-bold text-slate-700">Senha</label>
                <a href="#" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700 hover:underline">Esqueceu a senha?</a>
            </div>
            <div class="relative">
                <span class="absolute left-4 top-3.5 text-slate-400 transition-colors" [class.text-emerald-500]="isFieldValid('password')">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                </span>
                <input 
                    type="password" 
                    formControlName="password"
                    class="w-full pl-11 pr-4 py-3 bg-white/50 border rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-800"
                    [class.border-red-400]="isFieldInvalid('password')"
                    [class.border-slate-200]="!isFieldInvalid('password')"
                    placeholder="••••••••"
                >
            </div>
        </div>

        <!-- Botão com Spinner -->
        <button 
            type="submit" 
            [disabled]="loginForm.invalid || isLoading"
            class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 disabled:bg-emerald-400 disabled:cursor-not-allowed text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition-all transform hover:-translate-y-1 flex justify-center items-center gap-2 mt-4 cursor-pointer"
        >
            <span *ngIf="!isLoading">Entrar na Conta</span>
            <span *ngIf="!isLoading">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            </span>
            
            <!-- Spinner -->
            <svg *ngIf="isLoading" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </button>
    </form>

    <!-- Social Login -->
    <div class="mt-6">
        <div class="relative flex py-2 items-center">
            <div class="flex-grow border-t border-slate-200"></div>
            <span class="flex-shrink-0 mx-4 text-xs font-bold text-slate-400 uppercase">Ou entre com</span>
            <div class="flex-grow border-t border-slate-200"></div>
        </div>
        <div class="flex gap-3 justify-center mt-2">
            <button class="w-12 h-12 bg-white border border-slate-200 rounded-full flex items-center justify-center hover:bg-slate-50 transition-colors shadow-sm">
                <img src="https://img.icons8.com/color/48/000000/google-logo.png" alt="Google" class="w-6 h-6">
            </button>
            <button class="w-12 h-12 bg-white border border-slate-200 rounded-full flex items-center justify-center hover:bg-slate-50 transition-colors shadow-sm">
                <img src="https://img.icons8.com/ios-filled/50/000000/mac-os.png" alt="Apple" class="w-6 h-6">
            </button>
            <button class="w-12 h-12 bg-white border border-slate-200 rounded-full flex items-center justify-center hover:bg-slate-50 transition-colors shadow-sm">
                <img src="https://img.icons8.com/color/48/000000/facebook-new.png" alt="Facebook" class="w-6 h-6">
            </button>
        </div>
    </div>

    <!-- Link para Signup -->
    <div class="mt-8 pt-6 border-t border-slate-200/60 text-center">
        <p class="text-slate-600 text-sm">
            Novo por aqui? 
            <button (click)="onSignupClick()" class="text-emerald-600 font-bold hover:underline ml-1 cursor-pointer">Criar conta grátis</button>
        </p>
    </div>
</div>
