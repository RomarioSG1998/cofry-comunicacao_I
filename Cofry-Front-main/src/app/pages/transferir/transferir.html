<div class="min-h-screen bg-[#F0F4F8] font-sans text-slate-900 pb-20 relative overflow-x-hidden">
  
  <!-- Background Gradient Mesh (Top Left) -->
  <div class="absolute top-0 left-0 w-full h-[500px] bg-gradient-to-b from-indigo-50/80 to-transparent pointer-events-none z-0"></div>
  <div class="absolute -top-20 -left-20 w-96 h-96 bg-indigo-200/20 rounded-full blur-3xl pointer-events-none z-0"></div>

  <main class="relative z-10 p-6 max-w-5xl mx-auto space-y-8 mt-4">
    
    <!-- Back Arrow Button -->
    <div class="flex items-center mb-4 pl-2">
        <button (click)="goHome()" class="flex items-center gap-2 text-slate-500 hover:text-indigo-600 transition-colors group">
            <div class="p-2 rounded-full bg-white group-hover:bg-white/80 shadow-sm border border-slate-100 transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
            </div>
            <span class="text-sm font-bold text-slate-600 group-hover:text-indigo-700">Voltar para Home</span>
        </button>
    </div>

    <!-- Hero Balance Card -->
    <section class="rounded-[2.5rem] bg-[#0F172A] p-10 text-white shadow-xl shadow-slate-200/50 flex flex-col justify-center h-48 relative overflow-hidden">
         <div class="absolute right-0 top-0 w-64 h-64 bg-slate-800/30 rounded-full blur-3xl -mr-16 -mt-16"></div>
         
         <div class="relative z-10">
           <span class="text-slate-400 text-sm font-medium mb-1 block">Saldo disponível</span>
           <div class="flex items-center gap-4">
             <h2 class="text-4xl md:text-5xl font-extrabold tracking-tight">
               R$ {{ balance }}
             </h2>
             <button class="text-slate-500 hover:text-white transition-colors mt-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
             </button>
           </div>
         </div>
    </section>

    <!-- Transfer Section (Input + Button) -->
    <section class="bg-white rounded-[2rem] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-slate-50">
      <h3 class="font-bold text-slate-800 text-lg mb-6 flex items-center gap-3">
        <svg class="text-indigo-500" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
        Nova Transferência TED/DOC
      </h3>
      
      <form (submit)="sendTransfer($event)" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Nome do Destinatário</label>
            <input 
              type="text" 
              [(ngModel)]="transferForm.destinatario" 
              name="destinatario"
              required 
              placeholder="Nome completo do favorecido" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none"
            >
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Banco Destino</label>
            <input 
              type="text" 
              [(ngModel)]="transferForm.banco" 
              name="banco"
              required 
              placeholder="Ex: Itaú, Bradesco, Nubank..." 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none"
            >
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Agência</label>
            <input 
              type="text" 
              [(ngModel)]="transferForm.agencia" 
              name="agencia"
              required 
              placeholder="0001" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none"
            >
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Conta</label>
            <input 
              type="text" 
              [(ngModel)]="transferForm.conta" 
              name="conta"
              required 
              placeholder="12345-6" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none"
            >
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Valor (R$)</label>
            <input 
              type="number" 
              step="0.01" 
              [(ngModel)]="transferForm.valor" 
              name="valor"
              required 
              placeholder="0,00" 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none"
            >
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
          <div>
            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Conta Origem</label>
            <select 
              [(ngModel)]="transferForm.idConta" 
              name="idConta"
              required 
              class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all outline-none cursor-pointer"
            >
              <option *ngFor="let acc of accounts" [value]="acc.idConta">{{ acc.instituicao }} - Saldo: {{ acc.saldo | currency:'BRL' }}</option>
            </select>
          </div>
          <div class="flex items-end">
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-10 rounded-xl transition-all shadow-lg shadow-indigo-200 active:scale-95 whitespace-nowrap">
              Confirmar Transferência
            </button>
          </div>
        </div>
      </form>
    </section>

  </main>
</div>
