<div class="min-h-screen text-slate-900 overflow-hidden relative font-sans flex items-center justify-center py-10">
  
   <main class="relative z-10 w-full max-w-xl px-6">
     
     <div class="w-full bg-white/60 backdrop-blur-xl border border-white/40 rounded-3xl shadow-[0_30px_60px_-12px_rgba(0,0,0,0.15)] p-8 md:p-10 animate-fade-in-up">
        
        <div class="flex justify-center mb-6">
            <div class="flex items-center gap-2 cursor-pointer">
                <div class="w-8 h-8 bg-gradient-to-tr from-emerald-500 to-emerald-700 rounded-lg flex items-center justify-center shadow-lg shadow-emerald-500/30">
                    <img src="logo.svg" alt="Logo Cofry" class="w-5 h-5 object-contain drop-shadow-sm">
                </div>
                <span class="text-xl font-bold tracking-tight text-slate-800">Cofry</span>
            </div>
        </div>


        <form [formGroup]="signupForm" (ngSubmit)="onSubmit()" class="space-y-4">
<!--
              <div class="space-y-1">
              <label class="text-sm font-bold text-slate-700 ml-1">
               Nome Completo</label>
               <input type="text" formControlName="nome" class="w-full pl-4 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-800 placeholder:text-slate-400" placeholder="Seu nome completo">
              </div>
-->
               <div class="space-y-1">
                  <label for="nome" class="text-sm font-bold text-slate-700 ml-1">Nome Completo</label>
                  <input type="text" id="nome" formControlName="nome" class="w-full pl-4 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-800 placeholder:text-slate-400" placeholder="Seu nome completo">
                  <small *ngIf="signupForm.get('nome')?.invalid && signupForm.get('nome')?.touched" class="error-msg">
                     Nome é obrigatório (min 3 letras).
                  </small>
               </div>
                     

               
               <div class="space-y-1">
                  <label for="email" class="text-sm font-bold text-slate-700 ml-1">Email</label>
                  <input type="text" id="email" formControlName="email" class="w-full pl-4 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-800 placeholder:text-slate-400" placeholder="seu@email.com">
                  <small *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="error-msg">
                    email burro
                  </small>
               </div>


               <div class="space-y-1">
                  <label for="dateOfBirth" class="text-sm font-bold text-slate-700 ml-1">ze</label>
                  <input 
                      type="date"
                       formControlName="dateOfBirth"
                       class="w-full pl-11 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-800 placeholder:text-slate-400">
               <small *ngIf="signupForm.get('dateOfBirth')?.invalid && signupForm.get('dateOfBirth')?.touched" class="error-msg">
                    Data de nascimento é obrigatória.
                  </small>

               </div>


                 
              


         
              <div class="grid grid-cols-2 gap-4">
                  <div class="space-y-1">
                  <label for="cpf" class="text-sm font-bold text-slate-700 ml-1">CPF</label>
                  <input type="text" formControlName="cpf" class="w-full pl-4 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-800 placeholder:text-slate-400" placeholder="000.000.000-00">
                  <small *ngIf="signupForm.get('cpf')?.invalid && signupForm.get('cpf')?.touched" class="error-msg">
                    CPF inválido
                  </small>
               </div>
               <div class="space-y-1">
                  <label for="password" class="text-sm font-bold text-slate-700 ml-1">Senha</label>
                  <input type="password" formControlName="password" class="w-full pl-4 pr-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-500 transition-all text-slate-800 placeholder:text-slate-400" placeholder="********">
                  <small *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="error-msg">
                    senha o bobo alegre
                  </small>
               </div>
              </div>
           

            <button
            type="submit"
            class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg shadow-emerald-600/20 transition-all transform hover:-translate-y-1 flex justify-center items-center gap-2 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
            Criar Conta 
            </button>
        </form>
          
       
        <div class="mt-6 text-center">
           <p class="text-slate-600 text-sm">
              Já tem uma conta? 
              <button class="text-emerald-600 font-bold hover:underline ml-1 cursor-pointer">Fazer Login</button>
           </p>
        </div>
      </div> </main>
</div>
