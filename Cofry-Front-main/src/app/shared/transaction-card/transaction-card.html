<div class="flex items-center justify-between py-4 border-b border-slate-100 last:border-b-0 hover:bg-slate-50/50 transition-colors">
  
  <!-- Data (caixa pequena à esquerda) -->
  <div class="flex-shrink-0 w-14 mr-4">
    <div class="bg-slate-100 rounded-lg px-2 py-1.5 text-center">
      <p class="text-xs font-medium text-slate-600 leading-tight">
        {{ getFormattedDate() }}
      </p>
    </div>
  </div>

  <!-- Informações principais (descrição e categoria) -->
  <div class="flex-1 min-w-0 mr-4">
    <p class="text-sm font-semibold text-slate-800 mb-0.5 truncate">
      {{ transaction.descricao }}
    </p>
    <p class="text-xs text-slate-500">
      {{ getCategoryLabel() }}
    </p>
  </div>

  <!-- Valor, tags e ações -->
  <div class="flex items-center gap-2 flex-shrink-0">
    <!-- Tags opcionais (Recorrente, Parcela, etc.) -->
    <ng-container *ngIf="hasTags()">
      <span 
        *ngFor="let tag of getTags()" 
        [ngClass]="tag.class"
        class="px-2.5 py-0.5 rounded-full text-xs font-medium text-white"
      >
        {{ tag.label }}
      </span>
    </ng-container>

    <!-- Valor -->
    <div class="text-sm font-semibold text-slate-800 min-w-[90px] text-right">
      {{ getFormattedAmount() }}
    </div>

    <!-- Slot para ações (editar/excluir) - será inserido pelo componente pai se necessário -->
    <ng-content></ng-content>
  </div>

</div>
